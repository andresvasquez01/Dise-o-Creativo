<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Tickets - Plataforma Secretaría</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
 <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

  <header class="bg-blue-900 text-white p-4 text-center">
    <h1 class="text-2xl font-bold">Plataforma Secretaría - Escuela de Ciencias Exactas</h1>
    <p class="text-sm">Universidad Sergio Arboleda</p>
  </header>

<nav class="flex justify-between items-center bg-blue-900 text-white p-2">
  <div class="space-x-4">
    <a href="foro.html">Foro</a>
    <a href="publicaciones.html">Publicaciones</a>
    <a href="tickets.html" class="underline">Tickets</a>
  </div>
  <div class="flex items-center space-x-4">
    <span id="rol-usuario" class="text-sm"></span>
    <button onclick="cerrarSesion()" class="bg-red-500 px-3 py-1 rounded">Cerrar sesión</button>
  </div>
</nav>

<div class="foro-bg">
  <main class="p-6">
    <section id="tickets">
      <h2 class="text-xl font-bold mb-4">Sistema de Tickets</h2>

      <!-- Formulario para enviar ticket -->
      <form id="form-ticket" class="mb-6 space-y-4">
        <input id="nombre" type="text" placeholder="Tu nombre" class="w-full p-2 border rounded" required />
        <textarea id="mensaje" placeholder="Describe tu solicitud" class="w-full p-2 border rounded" required></textarea>
        <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded">Enviar Ticket</button>
      </form>

      <h3 class="text-lg font-semibold mb-3">Tickets Recibidos</h3>
      <div id="ticket-lista" class="space-y-4 mb-8"></div>

      <!-- Formulario para responder tickets (solo visible para admin) -->
      <form id="form-responder" class="hidden mb-6 space-y-4">
        <textarea id="respuesta" placeholder="Escribe una respuesta al ticket" class="w-full p-2 border rounded" required></textarea>
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Responder Ticket</button>
      </form>

      <!-- Respuestas de administradores -->
      <div id="respuestas" class="space-y-3"></div>

    </section>
  </main>
</div>
  <script>
    function iniciarSesion() {
  const usuario = document.getElementById("usuario").value;
  const contrasena = document.getElementById("contrasena").value;

  if (usuario === "admin" && contrasena === "admin123") {
    sessionStorage.setItem("rol", "admin");
    window.location.href = "foro.html";
  } else {
    sessionStorage.setItem("rol", "usuario");
    window.location.href = "foro.html";
  }
}
  </script>
  <script src="js/tickets.js"></script>
</body>
</html>
